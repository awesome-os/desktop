<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q(self) Bounded CAS Orbit — Mandelbrot WebGPU Explorer (OPFS v11)</title>
  <style>
    :root {
      --bg: #070a12;
      --panel: rgba(13, 18, 32, 0.92);
      --fg: #e2e8f0;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --violet: #a78bfa;
      --green: #34d399;
      --amber: #f59e0b;
      --red: #fb7185;
      --border: rgba(148, 163, 184, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--fg);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    .shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
    .topbar {
      height: 38px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: rgba(10, 14, 24, 0.95); border-bottom: 1px solid var(--border);
      font-size: 12px; gap: 8px; flex-shrink: 0;
    }
    .tb-group { display: flex; align-items: center; gap: 8px; }
    .pill {
      padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
      font-family: ui-monospace, Consolas, monospace;
      background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35); color: var(--cyan);
      cursor: pointer;
    }
    .pill:hover { border-color: var(--violet); color: #fff; }
    .pill.active { background: var(--cyan); color: #05131c; }

    .main {
      flex: 1; display: grid; grid-template-columns: 1.35fr 0.65fr; min-height: 0;
    }
    @media (max-width: 900px) { .main { grid-template-columns: 1fr; grid-template-rows: 1.1fr 0.9fr; } }

    .viewport { position: relative; overflow: hidden; background: #04060c; }
    #fractal-canvas, #orbit-overlay {
      position: absolute; inset: 0; width: 100%; height: 100%; display: block;
    }
    #orbit-overlay { pointer-events: none; }
    .hud {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 8px 12px; border-radius: 12px;
      background: rgba(8, 12, 22, 0.84); backdrop-filter: blur(12px);
      border: 1px solid var(--border); font-family: ui-monospace, Consolas, monospace; font-size: 11.5px;
    }

    .inspector {
      display: flex; flex-direction: column; border-left: 1px solid var(--border);
      background: var(--panel); min-height: 0; overflow: hidden;
    }
    .insp-sec {
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .insp-title { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .row { display: flex; align-items: center; gap: 8px; }
    .inp {
      flex: 1; background: #080d18; border: 1px solid var(--border); border-radius: 8px;
      color: #fff; padding: 6px 10px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; outline: none;
    }
    .inp:focus { border-color: var(--cyan); }
    .badge {
      padding: 3px 8px; border-radius: 6px; font-family: ui-monospace, Consolas, monospace;
      font-size: 11px; font-weight: 800;
    }
    .badge.bounded { background: rgba(52, 211, 153, 0.18); color: var(--green); border: 1px solid var(--green); }
    .badge.escaped { background: rgba(251, 113, 133, 0.18); color: var(--red); border: 1px solid var(--red); }
    .badge.fixed-point { background: rgba(56, 189, 248, 0.18); color: var(--cyan); border: 1px solid var(--cyan); }
    .badge.cycle { background: rgba(245, 158, 11, 0.18); color: var(--amber); border: 1px solid var(--amber); }

    .kv { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.55; color: #cbd5e1; }
    .kv strong { color: var(--cyan); }

    .orbit-list {
      flex: 1; overflow-y: auto; padding: 10px 14px;
      font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.5;
      display: flex; flex-direction: column; gap: 3px;
    }
    .orbit-row { display: flex; align-items: center; gap: 8px; }
    .mag-bar-wrap { width: 64px; height: 7px; background: #0f172a; border-radius: 4px; overflow: hidden; }
    .mag-bar { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--violet), var(--red)); }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="tb-group">
        <strong>Q(self) &rarr; Bounded CAS Orbit</strong>
        <span style="color:var(--muted);font-family:ui-monospace,Consolas,monospace">z<sub>n+1</sub> = z<sub>n</sub>&sup2; + c</span>
        <span class="pill" id="gpu-pill">GPU: Init...</span>
      </div>
      <div class="tb-group">
        <button class="pill active" id="mode-mandel" onclick="setMode('mandelbrot')">Mandelbrot</button>
        <button class="pill" id="mode-julia" onclick="setMode('julia')">Julia (Anchor c)</button>
        <button class="pill" onclick="resetView()">Reset View</button>
        <button class="pill" onclick="persistOrbitOpfs()" id="opfs-btn">Persist Orbit &rarr; OPFS v11</button>
        <button class="pill" onclick="location.href='./'">&#8635; Greeter</button>
      </div>
    </header>

    <main class="main">
      <div class="viewport" id="viewport">
        <canvas id="fractal-canvas"></canvas>
        <canvas id="orbit-overlay"></canvas>
        <div class="hud">
          <span id="hud-coords">Click to inspect CAS orbit · Wheel to zoom · Drag to pan</span>
          <span id="hud-zoom">zoom: 1.00x</span>
        </div>
      </div>

      <aside class="inspector">
        <div class="insp-sec">
          <div class="insp-title">1. Constant CAS Anchor (c)</div>
          <div class="row">
            <input id="anchor-in" class="inp" value="Q(self)=v11/files/79/795d9e" />
            <button class="pill" onclick="seedFromAnchor()">Seed c</button>
          </div>
          <div class="row" style="justify-content:space-between">
            <label style="font-size:11.5px;color:var(--muted)">max_iter budget: <strong id="max-iter-lbl" style="color:#fff">96</strong></label>
            <input id="max-iter" type="range" min="24" max="320" step="8" value="96" style="width:140px;accent-color:var(--cyan)" />
          </div>
        </div>

        <div class="insp-sec">
          <div class="row" style="justify-content:space-between">
            <div class="insp-title">2. Bounded CAS Result</div>
            <span id="status-badge" class="badge bounded">BOUNDED</span>
          </div>
          <div class="kv" id="result-kv"></div>
        </div>

        <div class="insp-title" style="padding:10px 14px 0">3. Content-Addressed Orbit Trace (z<sub>0</sub> &rarr; z<sub>k</sub>)</div>
        <div class="orbit-list" id="orbit-list"></div>
      </aside>
    </main>
  </div>

  <script type="module">
    function fnv1aHex(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return h.toString(16).padStart(8, '0');
    }

    function anchorToComplex(anchor) {
      const h1 = parseInt(fnv1aHex(anchor + ':re'), 16) / 0xffffffff;
      const h2 = parseInt(fnv1aHex(anchor + ':im'), 16) / 0xffffffff;
      return { re: -0.78 + (h1 - 0.5) * 0.42, im: 0.14 + (h2 - 0.5) * 0.42 };
    }

    // Bounded recursive CAS iteration (mirrors cas-iterate.mts)
    const casMemo = new Map();
    function casIterateComplex(anchorLabel, cRe, cIm, maxIter) {
      let zr = 0, zi = 0;
      const orbit = [];
      const seen = new Set();
      const traj = [anchorLabel];
      let hits = 0;

      for (let i = 0; i < maxIter; i++) {
        const mag2 = zr * zr + zi * zi;
        const key = `${zr.toFixed(5)},${zi.toFixed(5)}`;
        const hash = fnv1aHex(key);
        const casHit = casMemo.has(hash);
        if (casHit) hits++; else casMemo.set(hash, { zr, zi });
        orbit.push({ iter: i, zr, zi, mag: Math.sqrt(mag2), hash, casHit });
        traj.push(hash);

        if (mag2 > 4.0) {
          return { status: 'escaped', iter: i, maxIter, cRe, cIm, finalHash: hash, trajectoryHash: fnv1aHex(traj.join('>')), casHits: hits, orbit };
        }
        seen.add(hash);
        const nzr = zr * zr - zi * zi + cRe;
        const nzi = 2 * zr * zi + cIm;
        const nHash = fnv1aHex(`${nzr.toFixed(5)},${nzi.toFixed(5)}`);
        if (nHash === hash) {
          return { status: 'fixed-point', iter: i + 1, maxIter, cRe, cIm, finalHash: nHash, trajectoryHash: fnv1aHex(traj.join('>')), casHits: hits, orbit };
        }
        if (seen.has(nHash)) {
          return { status: 'cycle', iter: i + 1, maxIter, cRe, cIm, finalHash: nHash, trajectoryHash: fnv1aHex(traj.join('>')), casHits: hits, orbit };
        }
        zr = nzr; zi = nzi;
      }
      const last = orbit[orbit.length - 1];
      return { status: 'bounded', iter: maxIter, maxIter, cRe, cIm, finalHash: last.hash, trajectoryHash: fnv1aHex(traj.join('>')), casHits: hits, orbit };
    }

    const canvas = document.getElementById('fractal-canvas');
    const overlay = document.getElementById('orbit-overlay');
    const octx = overlay.getContext('2d');
    const gpuPill = document.getElementById('gpu-pill');

    let view = { cx: -0.55, cy: 0.0, scale: 2.8, maxIter: 96, mode: 0 }; // mode 0=mandelbrot, 1=julia
    let anchorC = anchorToComplex(document.getElementById('anchor-in').value);
    let lastResult = null;

    // WebGPU WGSL Fractal Renderer with Canvas2D fallback
    let gpu = null;
    async function initRenderer() {
      if (navigator.gpu) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            const device = await adapter.requestDevice();
            const ctx = canvas.getContext('webgpu');
            if (ctx) {
              const format = navigator.gpu.getPreferredCanvasFormat();
              ctx.configure({ device, format, alphaMode: 'opaque' });
              const wgsl = /* wgsl */`
                struct U {
                  resScaleMode : vec4<f32>,
                  centerIter   : vec4<f32>,
                  juliaC       : vec4<f32>,
                };
                @group(0) @binding(0) var<uniform> u : U;

                @vertex
                fn vs(@builtin(vertex_index) i : u32) -> @builtin(position) vec4<f32> {
                  var p = array<vec2<f32>, 3>(vec2<f32>(-1.0, -3.0), vec2<f32>(-1.0, 1.0), vec2<f32>(3.0, 1.0));
                  return vec4<f32>(p[i], 0.0, 1.0);
                }

                @fragment
                fn fs(@builtin(position) fc : vec4<f32>) -> @location(0) vec4<f32> {
                  let res = max(u.resScaleMode.xy, vec2<f32>(1.0, 1.0));
                  let aspect = res.x / res.y;
                  let uv = (fc.xy / res - vec2<f32>(0.5, 0.5)) * vec2<f32>(aspect, 1.0);
                  let pt = vec2<f32>(u.centerIter.x, u.centerIter.y) + uv * u.resScaleMode.z;

                  var z = select(vec2<f32>(0.0, 0.0), pt, u.resScaleMode.w > 0.5);
                  let c = select(pt, u.juliaC.xy, u.resScaleMode.w > 0.5);
                  let maxI = i32(u.centerIter.z);
                  var iter = 0;
                  for (var k = 0; k < 512; k = k + 1) {
                    if (k >= maxI) { break; }
                    let m2 = z.x * z.x + z.y * z.y;
                    if (m2 > 4.0) { break; }
                    z = vec2<f32>(z.x * z.x - z.y * z.y + c.x, 2.0 * z.x * z.y + c.y);
                    iter = iter + 1;
                  }
                  if (iter >= maxI) {
                    return vec4<f32>(0.02, 0.03, 0.06, 1.0);
                  }
                  let t = f32(iter) / f32(maxI);
                  let col = vec3<f32>(
                    0.5 + 0.5 * cos(6.28318 * (t * 2.2 + 0.00)),
                    0.5 + 0.5 * cos(6.28318 * (t * 2.2 + 0.18)),
                    0.5 + 0.5 * cos(6.28318 * (t * 2.2 + 0.42))
                  );
                  return vec4<f32>(col * (0.35 + 0.65 * sqrt(t)), 1.0);
                }
              `;
              const mod = device.createShaderModule({ code: wgsl });
              const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: { module: mod, entryPoint: 'vs' },
                fragment: { module: mod, entryPoint: 'fs', targets: [{ format }] },
                primitive: { topology: 'triangle-list' },
              });
              const ubuf = device.createBuffer({ size: 48, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
              const bg = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: ubuf } }],
              });
              gpu = { device, ctx, pipeline, ubuf, bg };
              gpuPill.textContent = 'GPU: WebGPU WGSL';
              return;
            }
          }
        } catch {}
      }
      gpuPill.textContent = 'GPU: Canvas2D';
    }

    function resize() {
      const r = document.getElementById('viewport').getBoundingClientRect();
      const w = Math.max(100, Math.floor(r.width));
      const h = Math.max(100, Math.floor(r.height));
      canvas.width = w; canvas.height = h;
      overlay.width = w; overlay.height = h;
      renderFractal();
    }

    function renderFractal() {
      const w = canvas.width, h = canvas.height;
      const t0 = performance.now();
      if (gpu) {
        const data = new Float32Array([
          w, h, view.scale, view.mode,
          view.cx, view.cy, view.maxIter, 0,
          anchorC.re, anchorC.im, 0, 0,
        ]);
        gpu.device.queue.writeBuffer(gpu.ubuf, 0, data);
        const enc = gpu.device.createCommandEncoder();
        const pass = enc.beginRenderPass({
          colorAttachments: [{ view: gpu.ctx.getCurrentTexture().createView(), loadOp: 'clear', storeOp: 'store', clearValue: { r: 0, g: 0, b: 0, a: 1 } }],
        });
        pass.setPipeline(gpu.pipeline);
        pass.setBindGroup(0, gpu.bg);
        pass.draw(3);
        pass.end();
        gpu.device.queue.submit([enc.finish()]);
        gpuPill.textContent = `GPU: WebGPU (${(performance.now() - t0).toFixed(1)}ms)`;
      } else {
        const ctx = canvas.getContext('2d');
        const img = ctx.createImageData(w, h);
        const d = img.data;
        const aspect = w / h;
        const maxI = Math.min(view.maxIter, 128);
        for (let py = 0; py < h; py++) {
          const im0 = view.cy + (py / h - 0.5) * view.scale;
          for (let px = 0; px < w; px++) {
            const re0 = view.cx + (px / w - 0.5) * aspect * view.scale;
            let zr = view.mode ? re0 : 0, zi = view.mode ? im0 : 0;
            const cr = view.mode ? anchorC.re : re0, ci = view.mode ? anchorC.im : im0;
            let it = 0;
            while (it < maxI && zr * zr + zi * zi <= 4) {
              const nr = zr * zr - zi * zi + cr;
              zi = 2 * zr * zi + ci;
              zr = nr;
              it++;
            }
            const idx = (py * w + px) * 4;
            if (it >= maxI) { d[idx] = 6; d[idx + 1] = 10; d[idx + 2] = 18; d[idx + 3] = 255; }
            else {
              const t = it / maxI;
              d[idx] = Math.floor(127 + 127 * Math.cos(6.28 * (t * 2.1)));
              d[idx + 1] = Math.floor(127 + 127 * Math.cos(6.28 * (t * 2.1 + 0.18)));
              d[idx + 2] = Math.floor(127 + 127 * Math.cos(6.28 * (t * 2.1 + 0.42)));
              d[idx + 3] = 255;
            }
          }
        }
        ctx.putImageData(img, 0, 0);
        gpuPill.textContent = `GPU: Canvas2D (${(performance.now() - t0).toFixed(0)}ms)`;
      }
      document.getElementById('hud-zoom').textContent = `zoom: ${(2.8 / view.scale).toFixed(2)}x`;
      drawOrbitOverlay();
    }

    function complexToScreen(re, im) {
      const w = overlay.width, h = overlay.height, aspect = w / h;
      return [
        ((re - view.cx) / (view.scale * aspect) + 0.5) * w,
        ((im - view.cy) / view.scale + 0.5) * h,
      ];
    }

    function drawOrbitOverlay() {
      octx.clearRect(0, 0, overlay.width, overlay.height);
      if (!lastResult) return;
      const pts = lastResult.orbit.map((s) => complexToScreen(s.zr, s.zi));
      octx.strokeStyle = 'rgba(56, 189, 248, 0.85)';
      octx.lineWidth = 1.5;
      octx.beginPath();
      pts.forEach(([x, y], i) => { if (i === 0) octx.moveTo(x, y); else octx.lineTo(x, y); });
      octx.stroke();

      const [cx, cy] = complexToScreen(lastResult.cRe, lastResult.cIm);
      octx.fillStyle = '#facc15';
      octx.beginPath(); octx.arc(cx, cy, 4.5, 0, Math.PI * 2); octx.fill();
    }

    function inspectPoint(label, cRe, cIm) {
      anchorC = { re: cRe, im: cIm };
      lastResult = casIterateComplex(label, cRe, cIm, view.maxIter);
      const badge = document.getElementById('status-badge');
      badge.textContent = lastResult.status.toUpperCase();
      badge.className = 'badge ' + lastResult.status;

      document.getElementById('result-kv').innerHTML =
        `<div>Anchor c: <strong>${cRe.toFixed(6)} ${cIm >= 0 ? '+' : ''}${cIm.toFixed(6)}i</strong></div>` +
        `<div>Iterations: <strong>${lastResult.iter} / ${lastResult.maxIter}</strong> · CAS hits: <strong>${lastResult.casHits}</strong></div>` +
        `<div>Trajectory Hash: <strong>0x${lastResult.trajectoryHash}</strong></div>` +
        `<div>Final State Hash: <strong>0x${lastResult.finalHash}</strong></div>`;

      const list = document.getElementById('orbit-list');
      list.innerHTML = lastResult.orbit.slice(0, 48).map((s) => {
        const pct = Math.min(100, (s.mag / 2.2) * 100);
        return `<div class="orbit-row">` +
          `<span style="width:26px;color:var(--muted)">#${s.iter}</span>` +
          `<span style="width:74px;color:var(--cyan)">0x${s.hash}</span>` +
          `<div class="mag-bar-wrap"><div class="mag-bar" style="width:${pct.toFixed(0)}%"></div></div>` +
          `<span style="color:${s.mag > 2 ? 'var(--red)' : '#cbd5e1'}">|z|=${s.mag.toFixed(3)}</span>` +
          `${s.casHit ? '<span style="color:var(--green)">HIT</span>' : ''}` +
          `</div>`;
      }).join('');
      drawOrbitOverlay();
    }

    window.seedFromAnchor = () => {
      const label = document.getElementById('anchor-in').value.trim() || 'Q(self)';
      const pt = anchorToComplex(label);
      inspectPoint(label, pt.re, pt.im);
      if (view.mode === 1) renderFractal();
    };

    window.setMode = (m) => {
      view.mode = m === 'julia' ? 1 : 0;
      document.getElementById('mode-mandel').classList.toggle('active', view.mode === 0);
      document.getElementById('mode-julia').classList.toggle('active', view.mode === 1);
      renderFractal();
    };

    window.resetView = () => {
      view.cx = -0.55; view.cy = 0.0; view.scale = 2.8;
      renderFractal();
    };

    window.persistOrbitOpfs = async () => {
      if (!lastResult) return;
      const btn = document.getElementById('opfs-btn');
      try {
        const root = await navigator.storage.getDirectory();
        const v11 = await root.getDirectoryHandle('v11', { create: true });
        const files = await v11.getDirectoryHandle('files', { create: true });
        const shard = await files.getDirectoryHandle(lastResult.trajectoryHash.slice(0, 2), { create: true });
        const fh = await shard.getFileHandle(`orbit-${lastResult.trajectoryHash}.json`, { create: true });
        const w = await fh.createWritable();
        await w.write(JSON.stringify({
          magic: '0x33564742',
          anchor: document.getElementById('anchor-in').value,
          status: lastResult.status,
          iter: lastResult.iter,
          maxIter: lastResult.maxIter,
          c: { re: lastResult.cRe, im: lastResult.cIm },
          trajectoryHash: lastResult.trajectoryHash,
          finalHash: lastResult.finalHash,
        }, null, 2));
        await w.close();
        btn.textContent = `Saved OPFS:/v11/files/${lastResult.trajectoryHash.slice(0, 2)}/`;
        setTimeout(() => { btn.textContent = 'Persist Orbit → OPFS v11'; }, 2600);
      } catch (err) {
        btn.textContent = 'OPFS unavailable';
      }
    };

    canvas.addEventListener('click', (e) => {
      const r = canvas.getBoundingClientRect();
      const aspect = r.width / r.height;
      const re = view.cx + ((e.clientX - r.left) / r.width - 0.5) * aspect * view.scale;
      const im = view.cy + ((e.clientY - r.top) / r.height - 0.5) * view.scale;
      document.getElementById('anchor-in').value = `c(${re.toFixed(4)},${im.toFixed(4)})`;
      inspectPoint(`c(${re.toFixed(4)},${im.toFixed(4)})`, re, im);
      if (view.mode === 1) renderFractal();
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const aspect = r.width / r.height;
      const mx = view.cx + ((e.clientX - r.left) / r.width - 0.5) * aspect * view.scale;
      const my = view.cy + ((e.clientY - r.top) / r.height - 0.5) * view.scale;
      const factor = e.deltaY < 0 ? 0.78 : 1.28;
      view.scale *= factor;
      view.cx = mx - (mx - view.cx) * factor;
      view.cy = my - (my - view.cy) * factor;
      renderFractal();
    }, { passive: false });

    document.getElementById('max-iter').addEventListener('input', (e) => {
      view.maxIter = Number(e.target.value);
      document.getElementById('max-iter-lbl').textContent = String(view.maxIter);
      inspectPoint(document.getElementById('anchor-in').value, anchorC.re, anchorC.im);
      renderFractal();
    });

    window.addEventListener('resize', resize);
    await initRenderer();
    resize();
    window.seedFromAnchor();
  </script>
</body>
</html>
