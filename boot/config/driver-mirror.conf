# Awesome-OS v11 Network-Backed On-Demand CAS Driver Mirror Configuration
#
# Loaded by early boot / driver-hydrator when a matched modalias kernel module
# is not present locally in /lib/modules.
#
# Index format (/etc/awesome-os/driver-index.v11.conf):
#   <tier> <modalias_pattern> <module_path> <name> [sha512_or_dash]
#
# CAS storage layout:
#   - Pinned SHA-512:   ${CAS_ROOT}/files/<sha512[0..1]>/<sha512>
#   - Unpinned fallback: ${CAS_ROOT}/drivers/<uname-r>/<name>.ko
#
# Remote fetch URL:
#   ${AWESOME_V11_DRIVER_MIRROR}/<uname-r>/<name>.ko

AWESOME_V11_DRIVER_MIRROR=https://awesome-os.com/v11/drivers
CAS_ROOT=/var/lib/b8g/cas/v11
