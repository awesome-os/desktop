timeout: 2
serial: yes

/Awesome-OS Desktop v11 (Graphical Boot — Omarchy / Noctalia / ChonkStep / Sectium)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=ttyS0,115200 console=tty0 quiet loglevel=3
    module_path: boot():/boot/initramfs.cpio.zst

/Awesome-OS Desktop v11 (Terminal Mode — Dual tty0 + ttyS0)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=ttyS0,115200 console=tty0 awesome.nogui=1
    module_path: boot():/boot/initramfs.cpio.zst

/Awesome-OS Desktop v11 (CI Self-Test)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    cmdline: console=ttyS0,115200 quiet awesome.selftest=1
    module_path: boot():/boot/initramfs.cpio.zst
