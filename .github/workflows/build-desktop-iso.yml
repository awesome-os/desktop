name: Build and Boot Awesome-OS Desktop (Multi-Arch UEFI ISO & Netboot)

on:
  push:
    branches: [main]
    paths:
      - 'boot/**'
      - '.github/workflows/build-desktop-iso.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-boot-x86_64:
    name: Build & Boot Awesome-OS Desktop (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout awesome-os/desktop
        uses: actions/checkout@v4

      - name: Install build, ISO, disk, and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-utils ovmf xorriso mtools dosfstools \
            e2fsprogs parted zstd busybox-static musl-tools ca-certificates \
            jq curl cpio

      - name: Compile static musl PID 1 (/init) & Graphical Desktop (/bin/awesome-desktop-fb)
        run: |
          mkdir -p dist build
          musl-gcc -march=x86-64 -static -Os -s -Wall -Wextra -Werror boot/src/init.c -o dist/init-x86_64
          musl-gcc -march=x86-64 -static -Os -s -Wall -Wextra -Werror boot/src/fb_desktop.c -o dist/awesome-desktop-fb-x86_64
          file dist/init-x86_64 dist/awesome-desktop-fb-x86_64
          ls -lh dist/init-x86_64 dist/awesome-desktop-fb-x86_64

      - name: Build initramfs-x86_64.cpio.zst
        run: |
          ROOTFS="$PWD/build/rootfs"
          rm -rf "$ROOTFS"
          mkdir -p "$ROOTFS"/{bin,sbin,proc,sys,dev,tmp,run,root,var/lib/b8g/cas,etc/ssl/certs,etc/awesome-os}

          cp dist/init-x86_64 "$ROOTFS/init"
          chmod 755 "$ROOTFS/init"
          cp dist/awesome-desktop-fb-x86_64 "$ROOTFS/bin/awesome-desktop-fb"
          chmod 755 "$ROOTFS/bin/awesome-desktop-fb"
          cp boot/config/system.json "$ROOTFS/etc/awesome-os/system.json"

          cp /bin/busybox "$ROOTFS/bin/busybox"
          chmod 755 "$ROOTFS/bin/busybox"
          for cmd in sh mount umount uname ip udhcpc ls cat poweroff reboot wget sha256sum mkdir cp mv rm grep sed awk tar zcat echo sleep ps dmesg clear env id hostname; do
            ln -sf busybox "$ROOTFS/bin/$cmd"
          done

          ARCH="x86_64"
          COREUTILS_URL="https://github.com/awesome-os/coreutils/releases/latest/download/coreutils-linux-${ARCH}-musl"
          COREUTILS_HTTP="$(curl -sSL -o "$ROOTFS/bin/coreutils" -w '%{http_code}' "$COREUTILS_URL" || true)"
          if [ "$COREUTILS_HTTP" = "200" ] && [ -s "$ROOTFS/bin/coreutils" ]; then
            chmod 0755 "$ROOTFS/bin/coreutils"
            for cmd in ls cat cp mv rm mkdir ln chmod stat uname env pwd echo head tail wc sort uniq cut tr sha256sum sha512sum base64 sleep true false dd df du sync touch realpath readlink tee date nproc dirname basename; do
              ln -sf coreutils "$ROOTFS/bin/$cmd"
            done
          else
            rm -f "$ROOTFS/bin/coreutils"
          fi

          cp /etc/ssl/certs/ca-certificates.crt "$ROOTFS/etc/ssl/certs/ca-certificates.crt"
          cat << 'EOF' > "$ROOTFS/etc/os-release"
          NAME="Awesome-OS Desktop"
          VERSION="0.3.0"
          ID=awesome-os
          ARCH=x86_64
          PRETTY_NAME="Awesome-OS Desktop 0.3.0 (x86_64 v11 CAS Foundation)"
          B8G_ABI_MAGIC_V3=0x33564742
          EOF

          (cd "$ROOTFS" && find . -print0 | cpio --null -ov --format=newc | zstd -19 -T0) > dist/initramfs-x86_64.cpio.zst
          ls -lh dist/initramfs-x86_64.cpio.zst

      - name: Stage bootable Linux x86_64 kernel
        run: |
          KPATH="/boot/vmlinuz-$(uname -r)"
          if [ ! -f "$KPATH" ]; then
            KPATH=$(ls -1 /boot/vmlinuz-* | sort -V | tail -n 1)
          fi
          echo "Using kernel: $KPATH"
          sudo cp "$KPATH" dist/vmlinuz-x86_64
          sudo chmod 644 dist/vmlinuz-x86_64
          ls -lh dist/vmlinuz-x86_64

      - name: Fetch Limine v8 and build hybrid UEFI/BIOS ISO (x86_64)
        run: |
          git clone --depth=1 --branch=v8.x-binary https://github.com/limine-bootloader/limine.git build/limine
          make -C build/limine

          mkdir -p build/iso_root/boot/limine build/iso_root/EFI/BOOT
          cp dist/vmlinuz-x86_64 build/iso_root/boot/vmlinuz
          cp dist/initramfs-x86_64.cpio.zst build/iso_root/boot/initramfs.cpio.zst
          cp boot/config/limine.conf build/iso_root/boot/limine/limine.conf
          cp build/limine/limine-bios.sys build/limine/limine-bios-cd.bin build/limine/limine-uefi-cd.bin build/iso_root/boot/limine/
          cp build/limine/BOOTX64.EFI build/iso_root/EFI/BOOT/

          xorriso -as mkisofs \
            -R -r -J \
            -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            --efi-boot boot/limine/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            build/iso_root -o dist/awesome-os-desktop-x86_64.iso

          ./build/limine/limine bios-install dist/awesome-os-desktop-x86_64.iso
          ls -lh dist/awesome-os-desktop-x86_64.iso

      - name: Build GPT UEFI + ext4 AWESOME_V11 QCOW2 image (x86_64)
        run: |
          truncate -s 128M build/awesome-os-desktop-x86_64.img
          parted -s build/awesome-os-desktop-x86_64.img mklabel gpt
          parted -s build/awesome-os-desktop-x86_64.img mkpart ESP fat32 1MiB 65MiB
          parted -s build/awesome-os-desktop-x86_64.img set 1 esp on
          parted -s build/awesome-os-desktop-x86_64.img mkpart AWESOME_V11 ext4 65MiB 127MiB

          truncate -s 64M build/esp.img
          mkfs.fat -F 32 -n AWESOMEOS build/esp.img
          mmd -i build/esp.img ::/EFI ::/EFI/BOOT ::/boot ::/boot/limine
          mcopy -i build/esp.img build/limine/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mcopy -i build/esp.img boot/config/limine.conf ::/boot/limine/limine.conf
          mcopy -i build/esp.img dist/vmlinuz-x86_64 ::/boot/vmlinuz
          mcopy -i build/esp.img dist/initramfs-x86_64.cpio.zst ::/boot/initramfs.cpio.zst

          truncate -s 62M build/cas.img
          mkfs.ext4 -q -L AWESOME_V11 -F build/cas.img

          dd if=build/esp.img of=build/awesome-os-desktop-x86_64.img bs=1M seek=1 conv=notrunc status=none
          dd if=build/cas.img of=build/awesome-os-desktop-x86_64.img bs=1M seek=65 conv=notrunc status=none

          qemu-img convert -f raw -O qcow2 -c build/awesome-os-desktop-x86_64.img dist/awesome-os-desktop-x86_64.qcow2
          ls -lh dist/awesome-os-desktop-x86_64.qcow2

      - name: QEMU Boot Test 1 — Direct Kernel + Initramfs Self-Test (x86_64)
        run: |
          set -o pipefail
          timeout 60s qemu-system-x86_64 \
            -cpu max \
            -kernel dist/vmlinuz-x86_64 \
            -initrd dist/initramfs-x86_64.cpio.zst \
            -append "console=ttyS0,115200 awesome.selftest=1" \
            -nographic -m 512 -no-reboot | tee build/qemu-direct.log

          grep -F '[AWESOME-OS] PID 1 READY (B8G_ABI_MAGIC_V3=0x33564742)' build/qemu-direct.log
          grep -F '[AWESOME-OS] BARE-METAL V11 SELFTEST PASS' build/qemu-direct.log

      - name: QEMU Boot Test 2 — Hybrid ISO Boot via Limine (Dual tty0+ttyS0)
        run: |
          rm -f build/qemu-iso.log
          qemu-system-x86_64 \
            -cpu max \
            -cdrom dist/awesome-os-desktop-x86_64.iso \
            -boot d \
            -nographic -m 512 -no-reboot \
            > build/qemu-iso.log 2>&1 &
          QPID=$!

          FOUND=0
          for i in $(seq 1 60); do
            if grep -Fq '[AWESOME-OS] PID 1 READY (B8G_ABI_MAGIC_V3=0x33564742)' build/qemu-iso.log 2>/dev/null; then
              FOUND=1
              break
            fi
            if ! kill -0 "$QPID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill "$QPID" 2>/dev/null || true
          wait "$QPID" 2>/dev/null || true

          echo "=== ISO QEMU BOOT LOG ==="
          tail -n 60 build/qemu-iso.log
          test "$FOUND" -eq 1

      - name: Upload x86_64 workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awesome-os-desktop-x86_64
          path: |
            dist/awesome-os-desktop-x86_64.iso
            dist/awesome-os-desktop-x86_64.qcow2
            dist/vmlinuz-x86_64
            dist/initramfs-x86_64.cpio.zst
            dist/init-x86_64

  publish-release:
    name: Publish Awesome-OS Desktop v0.3.0 Release
    needs: [build-and-boot-x86_64]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download x86_64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: awesome-os-desktop-x86_64
          path: release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.3.0"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release-assets/* --repo "$REPO" \
              --title "Awesome-OS Desktop $TAG — Unified Cross-Platform Foundation" \
              --notes "Unified ChromeOS/Fuchsia-style bare-metal UEFI ISO, netboot kernel/initramfs (dual tty0+ttyS0), Wayland/WebGPU foundation, and pluggable desktop UI adapters (Omarchy, Noctalia, ChonkStep, Sectium, Kitty-Ink)."
          fi
